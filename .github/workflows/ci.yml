name: CI

on:
    push:
        branches: [ master ]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: [ '3.9', '3.10', '3.11' ]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6.0.0

            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v6.0.0
                with:
                    python-version: ${{ matrix.python-version }}

            -   name: Install SNMP tools
                run: |
                    sudo apt-get update
                    sudo apt-get install -y snmp

            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip wheel setuptools
                    python -m pip install -r requirements-versioned.txt
                    python -m pip install -r requirements-dev.txt
                    python -m pip install -r requirements-git.txt
                    python -m pip install -e .

            -   name: Unit tests
                run: unit_tests
                
            -   name: Run infsnmp3 dependencies
                uses: hoverkraft-tech/compose-action@v2.4.2
                with:
                    compose-file: "dev/infsnmp3_devdocker/docker-compose.yml"
                    
            -   name: Integration tests
                run: integration_tests

            -   name: Factory tests
                run: factory_tests
